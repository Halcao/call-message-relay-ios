<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>CallRelay</title>
<link rel="manifest" href="/pwa/manifest.webmanifest">
<link rel="icon" href="/pwa/icon-192.png">
<link rel="apple-touch-icon" href="/pwa/icon-192.png">
<link rel="stylesheet" href="/pwa/client.css">
</head>
<body>
<main id="app">

  <!-- 配对 -->
  <section id="pair-view" class="hidden">
    <header class="brand">
      <img src="/pwa/icon-192.png" alt="" class="logo">
      <h1>CallRelay</h1>
    </header>
    <div class="card">
      <h2>绑定此浏览器</h2>
      <p class="muted">粘贴网关连接密钥即可拨打电话和收发短信。</p>
      <input id="enroll-key" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="连接密钥">
      <input id="enroll-name" autocomplete="off" maxlength="64" placeholder="设备名称（可选）">
      <button id="enroll-btn" class="primary" type="button">配对（无需 App）</button>
      <details id="app-bind-details">
        <summary>已有 CallRelay App？使用 App 生成的通知绑定码</summary>
        <p class="muted">在 App「设置 → 网页通知」生成绑定码。</p>
        <form id="bind-form" class="row">
          <input id="bind-code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="绑定码">
          <button type="submit" class="primary">绑定</button>
        </form>
      </details>
      <p id="pair-error" class="error hidden"></p>
    </div>
  </section>

  <!-- 主界面 -->
  <section id="main-view" class="hidden">
    <header id="topbar">
      <div class="nav-leading">
        <h1 id="nav-title">电话</h1>
        <span id="conn-dot" title="连接状态" aria-hidden="true"></span>
      </div>
      <div class="nav-actions">
        <button id="messages-select-all" class="nav-text hidden" type="button">全选</button>
        <button id="messages-edit" class="nav-text hidden" type="button" aria-label="编辑短信">编辑</button>
        <button id="rules-link" class="nav-icon" type="button" aria-label="骚扰拦截与录音" title="骚扰拦截与录音">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.2 19 6v5.1c0 4.3-2.9 7.8-7 9.7-4.1-1.9-7-5.4-7-9.7V6z"/><path d="M9.2 12.1l2 2 3.6-4" stroke-linecap="round"/></svg>
        </button>
        <a id="settings-link" class="nav-icon" href="/pwa/" aria-label="通知与设置" title="通知与设置">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.7a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9v.09a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
        </a>
      </div>
    </header>

    <!-- 拨号 -->
    <section id="tab-dialer" class="tab">
      <div class="dial-line">
        <span class="line-seg">
          <select id="line-picker" class="line-capsule" aria-label="拨号线路"></select>
          <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l3 3 3-3"/></svg>
        </span>
      </div>
      <div id="dial-display" aria-live="polite"></div>
      <div id="dial-suggestions" class="suggestions hidden"></div>
      <div id="keypad"></div>
      <div class="dial-actions">
        <button class="key ghost" data-key="" aria-hidden="true" tabindex="-1"></button>
        <button id="dial-call" class="call-btn" aria-label="拨打">
          <svg viewBox="0 0 24 24" width="30" height="30"><path fill="currentColor" d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.8 21 3 13.2 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
        </button>
        <button id="dial-delete" class="key ghost" aria-label="删除一位">
          <svg viewBox="0 0 28 20" width="30" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 2h13.2A2.5 2.5 0 0 1 26 4.5v11a2.5 2.5 0 0 1-2.5 2.5H10.3L2 10z"/><path d="M14.2 7.4l5.2 5.2M19.4 7.4l-5.2 5.2"/></svg>
        </button>
      </div>
    </section>

    <!-- 短信 -->
    <section id="tab-messages" class="tab hidden">
      <div id="thread-list"></div>
      <div id="sms-editbar" class="sms-editbar hidden">
        <button id="sms-mark-read" type="button">标记已读</button>
        <button id="sms-delete" type="button" class="danger">删除</button>
      </div>
      <div id="thread-view" class="hidden">
        <header id="thread-header">
          <button id="thread-back" class="nav-icon" aria-label="返回">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg>
          </button>
          <div class="thread-id">
            <div class="thread-name-row">
              <span class="avatar sm" id="thread-avatar"></span>
              <span id="thread-name"></span>
            </div>
            <select id="thread-line" class="line-pill" aria-label="对话线路"></select>
          </div>
          <button id="thread-call" class="nav-icon" aria-label="呼叫该号码">
            <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.8 21 3 13.2 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
          </button>
          <button id="thread-menu" class="nav-icon" aria-label="更多">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="5" cy="12" r="1.9" fill="currentColor"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/><circle cx="19" cy="12" r="1.9" fill="currentColor"/></svg>
          </button>
        </header>
        <div id="thread-messages"></div>
        <footer id="composer">
          <textarea id="composer-input" rows="1" maxlength="10000" placeholder="信息·短信"></textarea>
          <button id="composer-send" class="send-btn" aria-label="发送">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
          </button>
        </footer>
      </div>
      <div id="compose-view" class="hidden">
        <header id="compose-header">
          <button id="compose-cancel" type="button">取消</button>
          <strong>新信息</strong>
          <button id="compose-send" class="strong" type="button">发送</button>
        </header>
        <div class="compose-row"><label for="compose-to">收件人</label>
          <input id="compose-to" autocomplete="off" inputmode="tel" placeholder="输入号码">
        </div>
        <div id="compose-suggestions" class="suggestions hidden"></div>
        <div class="compose-row"><label for="compose-from">发件人</label>
          <select id="compose-from" aria-label="发件线路"></select>
        </div>
        <textarea id="compose-body" rows="6" maxlength="10000" placeholder="信息·短信"></textarea>
      </div>
      <button id="messages-compose" class="fab" type="button" aria-label="发短信">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      </button>
    </section>

    <!-- 通话记录 -->
    <section id="tab-calls" class="tab hidden">
      <div id="call-list"></div>
    </section>

    <!-- 通讯录 -->
    <section id="tab-contacts" class="tab hidden">
      <div id="contacts-toolbar">
        <div class="search-field">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.4"/><path d="m16 16 4.2 4.2"/></svg>
          <input id="contacts-search" type="search" autocomplete="off" placeholder="搜索姓名、号码或拼音">
        </div>
        <button id="contacts-import" class="nav-icon" type="button" aria-label="导入 vCard" title="导入 .vcf">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v10m0 0 3.8-3.8M12 13.5 8.2 9.7M4.5 16.5v2a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-2"/></svg>
        </button>
        <button id="contacts-export" class="nav-icon" type="button" aria-label="导出通讯录" title="导出 .vcf">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14.5v-10m0 0L8.2 8.3M12 4.5l3.8 3.8M4.5 16.5v2a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-2"/></svg>
        </button>
        <input id="contacts-file" type="file" accept=".vcf,text/vcard,text/x-vcard" class="hidden">
      </div>
      <div id="contacts-preview" class="hidden">
        <div class="preview-head">
          <strong id="contacts-preview-title">导入预览</strong>
          <span id="contacts-preview-summary" class="muted"></span>
        </div>
        <div id="contacts-preview-list"></div>
        <div class="preview-actions">
          <button id="contacts-preview-cancel" type="button">取消</button>
          <button id="contacts-preview-commit" class="primary" type="button">确认导入</button>
        </div>
      </div>
      <div id="contacts-list"></div>
      <p id="contacts-note" class="muted hidden"></p>
    </section>

    <nav id="tabbar">
      <button class="tabbtn active" data-tab="dialer" aria-label="电话">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.8 21 3 13.2 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
        <span>电话</span></button>
      <button class="tabbtn" data-tab="messages" aria-label="短信">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3.4c-5.2 0-9.4 3.5-9.4 7.9 0 2.5 1.4 4.7 3.6 6.1-.1 1.2-.7 2.3-1.7 3.2 1.7-.1 3.2-.7 4.4-1.7.9.2 2 .3 3.1.3 5.2 0 9.4-3.5 9.4-7.9S17.2 3.4 12 3.4z"/></svg>
        <span>短信</span></button>
      <button class="tabbtn" data-tab="calls" aria-label="通话记录">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.3V12l3.1 1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>通话记录</span></button>
      <button class="tabbtn" data-tab="contacts" aria-label="通讯录">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="10" r="2.7"/><path d="M6.7 18.4c.8-2.3 2.8-3.8 5.3-3.8s4.5 1.5 5.3 3.8" stroke-linecap="round"/></svg>
        <span>通讯录</span></button>
    </nav>
  </section>

  <!-- 骚扰拦截与录音（规则/录音库，key 级） -->
  <section id="rules-view" class="hidden">
    <header id="rules-bar">
      <button id="rules-back" class="topbar-action" type="button">返回</button>
      <strong>骚扰拦截</strong>
      <span id="rules-status"></span>
    </header>
    <div id="rules-body">
      <div id="rules-unsupported" class="hidden">当前网关版本不支持骚扰拦截设置。</div>
      <section id="rules-toggles">
        <label><input type="checkbox" id="rules-call-toggle"> 拦截来电</label>
        <label><input type="checkbox" id="rules-sms-toggle"> 拦截短信</label>
        <p class="hint">未知号码默认放行。</p>
      </section>
      <h3>拦截号码</h3>
      <ul id="rules-blocked"></ul>
      <div class="rules-add">
        <input id="rules-block-number" type="text" inputmode="tel" placeholder="完整号码或前缀">
        <select id="rules-block-kind"><option value="exact">完整号码</option><option value="prefix">号码前缀</option></select>
        <button id="rules-block-add" type="button">添加</button>
      </div>
      <h3>信任号码</h3>
      <ul id="rules-trusted"></ul>
      <div class="rules-add">
        <input id="rules-trust-number" type="text" inputmode="tel" placeholder="完整号码">
        <button id="rules-trust-add" type="button">添加</button>
      </div>
      <h3>导入名单（默认仅标记）</h3>
      <textarea id="rules-import-text" rows="3" placeholder="每行一个号码"></textarea>
      <button id="rules-import" type="button">导入为新名单</button>
      <ul id="rules-lists"></ul>
      <h3>拦截记录</h3>
      <ul id="rules-history"></ul>
      <button id="rules-history-clear" type="button">清空拦截记录</button>
      <h3>垃圾短信</h3>
      <div class="rules-add">
        <select id="rules-sms-folder"><option value="junk">垃圾箱</option><option value="normal">正常</option></select>
        <button id="rules-sms-refresh" type="button">刷新</button>
      </div>
      <ul id="rules-threads"></ul>
      <h3>通话录音</h3>
      <label><input type="checkbox" id="rules-auto-record"> 自动录音（本机）</label>
      <p class="hint" id="rules-auto-hint"></p>
      <ul id="rules-recordings"></ul>
    </div>
  </section>

  <!-- 通话 -->
  <section id="call-view" class="hidden">
    <div class="call-card">
      <div class="avatar large" id="call-avatar"></div>
      <p id="call-peer">—</p>
      <p id="call-sub"></p>
      <p id="call-state" class="muted">—</p>
      <div class="call-controls" id="call-controls"></div>
    </div>
  </section>

  <p id="toast" class="hidden" role="status" aria-live="polite"></p>
</main>
<script src="/pwa/pcmu.js"></script>
<script src="/pwa/audio.js"></script>
<script src="/pwa/webrtc.js"></script>
<script src="/pwa/denoise.js"></script>
<script src="/pwa/fixture.js"></script>
<script>
  // Keep the fixture marker when navigating to the settings page in preview.
  if (/[?&]fixture=1/.test(location.search)) {
    document.getElementById('settings-link').href = '/pwa/?fixture=1';
  }
</script>
<script src="/pwa/session.js"></script>
<script src="/pwa/callflow.js"></script>
<script src="/pwa/callevents.js"></script>
<script src="/pwa/threadlogic.js"></script>
<script src="/pwa/contactslogic.js"></script>
<script src="/pwa/client.js"></script>
<script src="/pwa/rules.js"></script>
</body>
</html>
