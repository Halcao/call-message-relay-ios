<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>CallRelay 通知与设置</title>
<link rel="manifest" href="/pwa/manifest.webmanifest">
<link rel="icon" href="/pwa/icon-192.png">
<link rel="apple-touch-icon" href="/pwa/icon-192.png">
<link rel="stylesheet" href="/pwa/styles.css">
</head>
<body>
<main class="page">

  <header class="nav">
    <a id="client-link" class="back" href="/pwa/client.html">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg>
      <span data-i18n="clientBack">返回</span>
    </a>
  </header>

  <h1 class="large-title" data-i18n="pageTitle">通知与设置</h1>

  <p id="unsupported" class="note warn hidden" data-i18n="unsupported">此浏览器不支持通知。请在 iPhone/iPad 上用 Safari 添加到主屏幕后再试。</p>
  <p id="install-help" class="note hidden" data-i18n="installHelp">请先用 Safari 将本页“添加到主屏幕”，再从主屏幕打开绑定。</p>

  <section id="bind-view" class="hidden">
    <p class="section-title" data-i18n="bindTitle">开启来电通知</p>
    <form id="bind-form">
      <div class="group">
        <p class="group-hint" data-i18n="bindHint">在 App 的“设置 → 网页通知”中生成绑定码，输入到下方。</p>
        <div class="field-row">
          <input id="bind-code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="绑定码" data-i18n-ph="bindPlaceholder">
        </div>
        <p id="bind-error" class="group-hint error hidden"></p>
      </div>
      <button type="submit" class="btn primary" data-i18n="bindButton">绑定</button>
    </form>
  </section>

  <section id="status-view" class="hidden">
    <p class="section-title" data-i18n="statusTitle">状态</p>
    <div class="group">
      <div class="cell"><span class="cell-label" data-i18n="deviceLabel">已绑定设备</span><span class="value" id="st-device">—</span></div>
      <div class="cell"><span class="cell-label" data-i18n="browserLabel">本浏览器</span><span class="value" id="st-browser">—</span></div>
      <div class="cell"><span class="cell-label" data-i18n="modeLabel">通知方式</span><span class="value" id="st-mode">—</span></div>
      <div class="cell"><span class="cell-label" data-i18n="subsLabel">浏览器订阅</span><span class="value" id="st-subs">—</span></div>
    </div>

    <p class="section-title" data-i18n="notifyTitle">通知</p>
    <div class="group">
      <button id="enable-push" class="action" type="button" data-i18n="enableButton">允许并开启通知</button>
      <button id="test-push" class="action" type="button" data-i18n="testButton">发送测试通知</button>
    </div>
    <p id="action-error" class="status-line error hidden" role="alert"></p>
    <p id="action-ok" class="status-line ok hidden" role="status"></p>

    <p id="mode-heading" class="section-title" data-i18n="modeLabel">通知方式</p>
    <div id="mode-group" class="group" role="radiogroup" aria-labelledby="mode-heading">
      <label class="cell choice">
        <span class="cell-label" data-i18n="modeNative">仅系统推送（App）</span>
        <input type="radio" name="mode" value="native">
        <span class="check" aria-hidden="true"></span>
      </label>
      <label class="cell choice">
        <span class="cell-label" data-i18n="modeBoth">系统推送 + 网页推送</span>
        <input type="radio" name="mode" value="both">
        <span class="check" aria-hidden="true"></span>
      </label>
      <label class="cell choice">
        <span class="cell-label" data-i18n="modeWeb">仅网页推送</span>
        <input type="radio" name="mode" value="web">
        <span class="check" aria-hidden="true"></span>
      </label>
    </div>

    <div id="subs-section" class="hidden">
      <p class="section-title" data-i18n="subsLabel">浏览器订阅</p>
      <ul id="sub-list" class="list group"></ul>
    </div>

    <p class="section-title" data-i18n="denoiseTitle">通话降噪</p>
    <div class="group">
      <label class="cell switch-row">
        <span class="cell-label" data-i18n="denoiseUplink">我的声音降噪</span>
        <span class="switch">
          <input type="checkbox" id="denoise-uplink">
          <span class="track" aria-hidden="true"></span>
        </span>
      </label>
      <label class="cell switch-row">
        <span class="cell-label" data-i18n="denoiseDownlink">对方声音降噪</span>
        <span class="switch">
          <input type="checkbox" id="denoise-downlink">
          <span class="track" aria-hidden="true"></span>
        </span>
      </label>
    </div>
    <p id="denoise-status" class="status-line" role="status" aria-live="polite"></p>

    <div class="group unbind-group">
      <details class="unbind">
        <summary class="cell">
          <span class="cell-label" data-i18n="unbindTitle">解除绑定</span>
          <span class="chev" aria-hidden="true"></span>
        </summary>
        <button id="unbind" class="action danger" type="button" data-i18n="unbindButton">解除本浏览器绑定</button>
      </details>
    </div>
  </section>

</main>
<script src="/pwa/fixture.js"></script>
<script src="/pwa/denoise.js"></script>
<script>
  // Keep the fixture marker on the ride back to the client in preview.
  if (/[?&]fixture=1/.test(location.search)) {
    document.getElementById('client-link').href = '/pwa/client.html?fixture=1';
  }
  // Standard-bar hairline once the page scrolls under the navigation bar.
  (function () {
    var nav = document.querySelector('.nav');
    if (!nav) return;
    function onScroll() { nav.classList.toggle('scrolled', window.scrollY > 4); }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }());
</script>
<script src="/pwa/app.js"></script>
</body>
</html>
